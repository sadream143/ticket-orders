name: Build installer

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "installer/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version from src/app.py
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path src/app.py -Pattern '^APP_VERSION = "([^"]+)"'
          $v = $m.Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Install Python packages
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Tesseract and Inno Setup
        shell: pwsh
        run: |
          choco install tesseract innosetup -y --no-progress
          if (-not (Test-Path "C:\Program Files\Tesseract-OCR\tesseract.exe")) { throw "Tesseract not found" }

      - name: Create icon
        shell: pwsh
        run: python scripts/make_icon.py

      - name: Build program folder (PyInstaller)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --noupx `
            --name TicketOrders --icon build/app.ico --paths src `
            --collect-all rapidocr --collect-all customtkinter `
            --collect-submodules omegaconf --collect-binaries onnxruntime `
            src/app.py
          if (-not (Test-Path dist/TicketOrders/TicketOrders.exe)) { throw "PyInstaller build failed" }

      - name: Add Tesseract to the program folder
        shell: pwsh
        run: |
          $src = "C:\Program Files\Tesseract-OCR"
          $dst = "dist\TicketOrders\tesseract"
          New-Item -ItemType Directory -Force "$dst\tessdata" | Out-Null
          Copy-Item "$src\tesseract.exe" $dst
          Copy-Item "$src\*.dll" $dst
          Copy-Item "$src\tessdata\eng.traineddata" "$dst\tessdata"
          Copy-Item "$src\tessdata\configs" "$dst\tessdata" -Recurse
          if (Test-Path "$src\tessdata\tessconfigs") { Copy-Item "$src\tessdata\tessconfigs" "$dst\tessdata" -Recurse }
          & "$dst\tesseract.exe" --version

      - name: Self-test the built program
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\TicketOrders\TicketOrders.exe" -ArgumentList "--selftest" -Wait -PassThru
          $res = Join-Path $env:TEMP "ticket_selftest_result.txt"
          if (Test-Path $res) { Get-Content $res } else { Write-Host "No self-test result file" }
          $log = Join-Path ([Environment]::GetFolderPath("MyDocuments")) "Ticket Orders\logs\app.log"
          if (Test-Path $log) { Write-Host "---- app.log"; Get-Content $log -Tail 40 }
          if ($p.ExitCode -ne 0) { throw "Self-test failed (exit code $($p.ExitCode))" }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "installer\TicketOrders.iss" "/DAppVersion=${{ steps.ver.outputs.version }}"
          if (-not (Test-Path "release\TicketOrders-Setup-${{ steps.ver.outputs.version }}.exe")) { throw "Installer not created" }

      - name: Create update manifest
        shell: pwsh
        run: |
          $notes = git log -1 --pretty=%s
          python scripts/make_manifest.py --version "${{ steps.ver.outputs.version }}" `
            --installer "release/TicketOrders-Setup-${{ steps.ver.outputs.version }}.exe" `
            --repo "${{ github.repository }}" --notes "$notes"

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $notes = git log -1 --pretty=%s
          gh release view "v$v" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "v$v" release/TicketOrders-Setup-$v.exe release/version.json --clobber
          } else {
            gh release create "v$v" release/TicketOrders-Setup-$v.exe release/version.json --title "v$v" --notes "$notes" --latest
          }
